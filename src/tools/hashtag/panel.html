<div class="panel" style="margin-top:16px">

      <div class="field" style="flex:2"><label for="hashTopic">Topic</label><input type="text" id="hashTopic" placeholder="e.g. coffee"></div>
      <div class="field" style="flex:1"><label for="hashCount">Count</label><input type="number" id="hashCount" value="15" min="5" max="30"></div>

    <div class="result" id="hashOut"></div>
  </div>
