<div class="panel" style="margin-top:16px">

      <div class="field" style="flex:2"><label for="descKeywords">Keywords (comma separated)</label><input type="text" id="descKeywords" placeholder="espresso, coffee gear, home barista"></div>

    <div class="field"><label for="descCta">Call to action (optional)</label><input type="text" id="descCta" placeholder="Subscribe for more coffee tips"></div>

    <div class="result" id="descOut" style="white-space:pre-wrap"></div>
  </div>
