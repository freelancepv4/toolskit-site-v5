<div class="panel" style="margin-top:16px">
    <div class="row">
      <div class="field" style="flex:1"><label for="loanPrincipal">[[amount]]</label><input type="number" id="loanPrincipal" value="200000" step="any"></div>
      <div class="field" style="flex:1"><label for="loanRate">[[rate]]</label><input type="number" id="loanRate" value="5" step="any"></div>
      <div class="field" style="flex:1"><label for="loanTerm">[[term]]</label><input type="number" id="loanTerm" min="0.1" value="25" step="any"></div>
    </div>
    <div class="result" id="loanResult">—</div>
  </div>
