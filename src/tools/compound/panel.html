<div class="panel" style="margin-top:16px">
    <div class="row">
      <div class="field" style="flex:1"><label for="ciPrincipal">[[principal]]</label><input type="number" id="ciPrincipal" value="1000" step="any"></div>
      <div class="field" style="flex:1"><label for="ciContrib">[[contrib]]</label><input type="number" id="ciContrib" value="100" step="any"></div>
      <div class="field" style="flex:1"><label for="ciRate">[[rate]]</label><input type="number" id="ciRate" value="6" step="any"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label for="ciFreq">[[freq]]</label><select id="ciFreq"><option value="12">[[freq_m]]</option><option value="4">[[freq_q]]</option><option value="1">[[freq_y]]</option></select></div>
      <div class="field" style="flex:1"><label for="ciYears">[[years]]</label><input type="number" id="ciYears" min="0.1" value="10" step="any"></div>
    </div>
    <div class="result" id="ciResult">—</div>
  </div>
