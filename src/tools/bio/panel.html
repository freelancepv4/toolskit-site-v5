<div class="panel" style="margin-top:16px">
    <div class="row">
      <div class="field" style="flex:1"><label for="bioName">Name / brand</label><input type="text" id="bioName" placeholder="e.g. Alex Rivera"></div>
      <div class="field" style="flex:1"><label for="bioRole">Role</label><input type="text" id="bioRole" placeholder="e.g. photographer"></div>
    </div>
    <div class="field"><label for="bioKeywords">Interests / keywords (comma separated)</label><input type="text" id="bioKeywords" placeholder="travel, coffee, film"></div>
    <button class="btn btn-primary" id="bioGen" type="button">Generate bios</button>
    <div class="result" id="bioOut"></div>
  </div>
