<div class="panel" style="margin-top:16px">
    <div class="row">
      <div class="field" style="flex:2"><label for="capTopic">Topic</label><input type="text" id="capTopic" placeholder="e.g. weekend hike"></div>
      <div class="field" style="flex:1"><label for="capTone">Tone</label><select id="capTone"><option>Casual</option><option>Professional</option><option>Playful</option><option>Inspirational</option></select></div>
    </div>
    <div class="field"><label for="capCta">Call to action (optional)</label><input type="text" id="capCta" placeholder="e.g. Tag a friend"></div>
    <button class="btn btn-primary" id="capGen" type="button">Generate captions</button>
    <div class="result" id="capOut"></div>
  </div>
