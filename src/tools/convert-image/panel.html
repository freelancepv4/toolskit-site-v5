<div class="panel" style="margin-top:16px">
    <div id="imgDrop" class="tk-drop"><p class="tk-drop-title">Drag &amp; drop your image here</p><p class="tk-drop-msg">or</p><label class="btn btn-primary">Choose image<input class="tk-vh" type="file" id="imgFile" accept="image/*"></label><p class="tk-drop-msg">Use a JPG, PNG or WebP image.</p></div>
    <div id="ctrl" class="hidden" style="margin-top:14px">
      <div class="note" id="origInfo"></div>
      <div class="field"><label for="fmt">Convert to</label>
        <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
      </div>
      <button class="btn btn-primary" id="go" type="button">Convert image</button>
      <div class="result" id="out">—</div>
    </div>
  </div>
