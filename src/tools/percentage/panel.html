<div class="panel" style="margin-top:16px">
    <div class="calc-block" data-block="a">
      <h2 class="blk-h">[[a_title]]</h2>
      <div class="row">
        <div class="field" style="flex:1"><label for="pcA1">[[a_pct]]</label><input type="number" id="pcA1" value="15" step="any"></div>
        <div class="field" style="flex:1"><label for="pcA2">[[a_of]]</label><input type="number" id="pcA2" value="200" step="any"></div>
      </div>
      <div class="result" id="pcRes1">—</div>
    </div>
    <div class="calc-block" data-block="b">
      <h2 class="blk-h">[[b_title]]</h2>
      <div class="row">
        <div class="field" style="flex:1"><label for="pcB1">[[b_part]]</label><input type="number" id="pcB1" value="30" step="any"></div>
        <div class="field" style="flex:1"><label for="pcB2">[[b_whole]]</label><input type="number" id="pcB2" value="200" step="any"></div>
      </div>
      <div class="result" id="pcRes2">—</div>
    </div>
    <div class="calc-block" data-block="c">
      <h2 class="blk-h">[[c_title]]</h2>
      <div class="row">
        <div class="field" style="flex:1"><label for="pcC1">[[c_from]]</label><input type="number" id="pcC1" value="200" step="any"></div>
        <div class="field" style="flex:1"><label for="pcC2">[[c_to]]</label><input type="number" id="pcC2" value="230" step="any"></div>
      </div>
      <div class="result" id="pcRes3">—</div>
    </div>
    <div class="calc-block" data-block="d">
      <h2 class="blk-h">[[d_title]]</h2>
      <div class="row">
        <div class="field" style="flex:1"><label for="pcD1">[[d_price]]</label><input type="number" id="pcD1" value="100" step="any"></div>
        <div class="field" style="flex:1"><label for="pcD2">[[d_pct]]</label><input type="number" id="pcD2" value="20" step="any"></div>
      </div>
      <div class="result" id="pcRes4">—</div>
    </div>
  </div>
