<div class="panel" style="margin-top:16px">
    <div class="row">
      <div class="field" style="flex:1"><label for="vatAmount">[[amount]]</label><input type="number" id="vatAmount" value="100" step="any"></div>
      <div class="field" style="flex:1"><label for="vatRate">[[rate]]</label><input type="number" id="vatRate" value="[[rate_default]]" step="any" aria-describedby="vatRateHelp"><p class="help" id="vatRateHelp">[[rate_help]]</p></div>
      <div class="field" style="flex:1"><label for="vatDir">[[dir]]</label><select id="vatDir"><option value="net-to-gross">[[dir_add]]</option><option value="gross-to-net">[[dir_remove]]</option></select></div>
    </div>
    <div class="result" id="vatResult">—</div>
  </div>
